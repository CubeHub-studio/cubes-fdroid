name: Build F-Droid Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install F-Droid Server
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Prepare F-Droid directories
        run: |
          mkdir -p fdroid/repo
          mkdir -p fdroid/metadata
          mkdir -p fdroid/keys

      - name: Verify APK
        run: |
          echo "Checking APK..."
          test -f repo/Sound_Of_Math.apk
          ls -lh repo/Sound_Of_Math.apk

      - name: Copy APK
        run: |
          cp repo/Sound_Of_Math.apk fdroid/repo/Sound_Of_Math.apk

      - name: Create F-Droid configuration
        run: |
          cat > fdroid/config.yml <<'EOF'
          repo_url: https://cubehub-studio.github.io/sound-of-math-fdroid/repo
          repo_name: Sound of Math F-Droid Repository
          repo_description: F-Droid repository for Sound of Math

          archive_older: 0

          keystore: keystore.p12
          keystorepass: soundofmath-keystore
          keypass: soundofmath-key
          repo_keyalias: soundofmath

          EOF

      - name: Generate repository signing key
        working-directory: fdroid
        run: |
          if [ ! -f keystore.p12 ]; then
            fdroid update --create-key
          fi

      - name: Generate F-Droid metadata
        working-directory: fdroid
        run: |
          fdroid update --create-metadata

      - name: Verify generated repository
        run: |
          echo "Generated files:"
          find fdroid/repo -maxdepth 2 -type f -print

          echo
          echo "Checking required repository files..."

          test -f fdroid/repo/index.jar
          test -f fdroid/repo/index.xml
          test -f fdroid/repo/Sound_Of_Math.apk

          echo
          echo "F-Droid repository generated successfully!"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid/repo

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
