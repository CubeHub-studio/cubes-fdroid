name: Build and Deploy F-Droid Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install F-Droid Server
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Check required secrets
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$FDROID_KEYSTORE" || {
            echo "ERROR: FDROID_KEYSTORE is missing."
            exit 1
          }

          test -n "$FDROID_KEYSTORE_PASSWORD" || {
            echo "ERROR: FDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$FDROID_KEY_PASSWORD" || {
            echo "ERROR: FDROID_KEY_PASSWORD is missing."
            exit 1
          }

          echo "All F-Droid secrets are present."

      - name: Prepare F-Droid directories
        run: |
          set -e

          rm -rf fdroid

          mkdir -p fdroid/repo
          mkdir -p fdroid/metadata

      - name: Restore signing keystore
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
        run: |
          set -e

          echo "$FDROID_KEYSTORE" | base64 --decode > fdroid/keystore.p12

          chmod 600 fdroid/keystore.p12

          test -s fdroid/keystore.p12

          echo "Signing keystore restored."

      - name: Copy APK
        run: |
          set -e

          test -f repo/Sound_Of_Math.apk

          cp repo/Sound_Of_Math.apk fdroid/repo/Sound_Of_Math.apk

          echo "APK copied:"
          ls -lh fdroid/repo/Sound_Of_Math.apk

      - name: Create metadata
        run: |
          set -e

          cat > fdroid/metadata/com.soundofmath.app.yml <<'EOF'
          Categories:
            - Science
            - Education

          License: Unknown

          WebSite: https://cubehub-studio.github.io/sound-of-math-fdroid/

          SourceCode: https://github.com/CubeHub-studio/sound-of-math-fdroid

          IssueTracker: https://github.com/CubeHub-studio/sound-of-math-fdroid/issues

          AutoName: Sound of Math

          Summary: Explore mathematics through sound

          Description: |
            Sound of Math is an application that turns mathematical concepts
            and calculations into sound.
          EOF

      - name: Create F-Droid configuration
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -e

          cat > fdroid/config.yml <<EOF
          repo_url: https://cubehub-studio.github.io/sound-of-math-fdroid/repo
          repo_name: Sound of Math F-Droid Repository
          repo_description: Official F-Droid repository for Sound of Math

          archive_older: 0

          keystore: keystore.p12
          keystorepass: "$FDROID_KEYSTORE_PASSWORD"
          keypass: "$FDROID_KEY_PASSWORD"
          repo_keyalias: soundofmath
          EOF

          chmod 600 fdroid/config.yml

      - name: Verify signing key
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        working-directory: fdroid
        run: |
          set -e

          keytool \
            -list \
            -v \
            -storetype PKCS12 \
            -keystore keystore.p12 \
            -storepass "$FDROID_KEYSTORE_PASSWORD" \
            -alias soundofmath

          echo "Signing key verified."

      - name: Generate F-Droid repository
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        working-directory: fdroid
        run: |
          set -e

          test -n "$FDROID_KEY_PASSWORD"
          test -n "$FDROID_KEY_PASS"
          test -n "$FDROID_KEYSTORE_PASSWORD"
          test -n "$FDROID_KEY_STORE_PASS"

          fdroid update

      - name: Show generated repository
        working-directory: fdroid
        run: |
          set -e

          echo "========================================"
          echo "Generated F-Droid repository:"
          echo "========================================"

          find repo -maxdepth 3 -type f -printf '%p\n' | sort

          echo
          echo "========================================"
          echo "Required files:"
          echo "========================================"

          test -f repo/Sound_Of_Math.apk
          test -f repo/index.jar
          test -f repo/index.xml

          if [ -f repo/index-v1.jar ]; then
            echo "FOUND: index-v1.jar"
          else
            echo "MISSING: index-v1.jar"
          fi

          if [ -f repo/index-v1.json ]; then
            echo "FOUND: index-v1.json"
          else
            echo "MISSING: index-v1.json"
          fi

          if [ -f repo/index-v2.json ]; then
            echo "FOUND: index-v2.json"
          else
            echo "MISSING: index-v2.json"
          fi

          if [ -f repo/entry.jar ]; then
            echo "FOUND: entry.jar"
          else
            echo "MISSING: entry.jar"
          fi

          if [ -f repo/entry.json ]; then
            echo "FOUND: entry.json"
          else
            echo "MISSING: entry.json"
          fi

      - name: Verify repository is not empty
        working-directory: fdroid
        run: |
          set -e

          test -s repo/index.jar
          test -s repo/index.xml

          echo "Repository contains a valid signed index."

      - name: Prepare GitHub Pages site
        run: |
          set -e

          rm -rf site
          mkdir -p site/repo

          cp -a fdroid/repo/. site/repo/

          echo "========================================"
          echo "GitHub Pages site:"
          echo "========================================"

          find site -maxdepth 3 -type f -printf '%p\n' | sort

          echo
          echo "========================================"
          echo "Verifying Pages repository:"
          echo "========================================"

          test -s site/repo/index.jar
          test -s site/repo/index-v1.jar
          test -s site/repo/index-v1.json
          test -s site/repo/index-v2.json
          test -s site/repo/entry.jar
          test -s site/repo/entry.json
          test -s site/repo/Sound_Of_Math.apk

          echo "GitHub Pages repository structure is valid."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
