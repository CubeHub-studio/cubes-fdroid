name: Build and Deploy F-Droid Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install F-Droid Server
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Check required secrets
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$FDROID_KEYSTORE" || { echo "ERROR: FDROID_KEYSTORE is missing."; exit 1; }
          test -n "$FDROID_KEYSTORE_PASSWORD" || { echo "ERROR: FDROID_KEYSTORE_PASSWORD is missing."; exit 1; }
          test -n "$FDROID_KEY_PASSWORD" || { echo "ERROR: FDROID_KEY_PASSWORD is missing."; exit 1; }
          echo "All F-Droid secrets are present."

      - name: Prepare F-Droid directories
        run: |
          set -e
          rm -rf fdroid
          mkdir -p fdroid/repo
          mkdir -p fdroid/metadata

      - name: Restore signing keystore
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
        run: |
          set -e
          echo "$FDROID_KEYSTORE" | base64 --decode > fdroid/keystore.p12
          chmod 600 fdroid/keystore.p12
          test -s fdroid/keystore.p12

      - name: Copy APK
        run: |
          set -e
          test -f repo/CH_Toolbox.apk
          cp repo/CH_Toolbox.apk fdroid/repo/CH_Toolbox.apk
          echo "APK copied:"
          ls -lh fdroid/repo/CH_Toolbox.apk

      - name: Create metadata
        run: |
          set -e
          cat > fdroid/metadata/com.cubehub.toolbox.yml <<'EOF'
          Categories:
            - Utilities

          License: Unknown

          WebSite: https://github.com/CubeHub-studio/cubes-fdroid
          SourceCode: https://github.com/CubeHub-studio/cubes-fdroid

          AutoName: CH: ToolBox

          Summary: A collection of useful tools from CubeHub

          Description: |
            CH: ToolBox is a collection of useful tools
            provided by CubeHub Studio.
          EOF

      - name: Create F-Droid configuration
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          set -e
          cat > fdroid/config.yml <<EOF
          repo_url: https://cubehub-studio.github.io/cubes-fdroid/repo
          repo_name: CH: ToolBox F-Droid Repository
          repo_description: Official F-Droid repository for CH: ToolBox

          archive_older: 0

          keystore: keystore.p12
          keystorepass: "$FDROID_KEYSTORE_PASSWORD"
          keypass: "$FDROID_KEY_PASSWORD"
          repo_keyalias: soundofmath
          EOF
          chmod 600 fdroid/config.yml

      - name: Verify signing key
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        working-directory: fdroid
        run: |
          set -e
          keytool -list -v -storetype PKCS12 -keystore keystore.p12 -storepass "$FDROID_KEYSTORE_PASSWORD" -alias soundofmath
          echo "Signing key verified."

      - name: Generate F-Droid repository
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        working-directory: fdroid
        run: |
          set -e
          fdroid update

      - name: Show generated repository
        working-directory: fdroid
        run: |
          set -e
          find repo -maxdepth 3 -type f -printf '%p\n' | sort
          test -f repo/CH_Toolbox.apk
          test -f repo/index.jar
          test -f repo/index.xml

      - name: Verify repository is not empty
        working-directory: fdroid
        run: |
          set -e
          test -s repo/index.jar
          test -s repo/index.xml

      - name: Prepare GitHub Pages site
        run: |
          set -e
          rm -rf site
          mkdir -p site/repo
          cp -a fdroid/repo/. site/repo/
          test -s site/repo/index.jar
          test -s site/repo/CH_Toolbox.apk

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
