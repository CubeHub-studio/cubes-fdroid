name: Build F-Droid Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install F-Droid Server
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Prepare F-Droid repository
        run: |
          mkdir -p repo
          mkdir -p icons
          mkdir -p fdroid

      - name: Copy APK
        run: |
          cp Sound_Of_Math.apk repo/Sound_Of_Math.apk

      - name: Generate repository metadata
        run: |
          cd fdroid
          fdroid update --create-metadata

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
