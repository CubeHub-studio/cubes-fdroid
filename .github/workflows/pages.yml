name: Build F-Droid Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install F-Droid Server
        run: |
          python -m pip install --upgrade pip
          python -m pip install fdroidserver

      - name: Prepare F-Droid directories
        run: |
          mkdir -p fdroid/repo
          mkdir -p fdroid/metadata

      - name: Verify APK
        run: |
          test -f repo/Sound_Of_Math.apk
          ls -lh repo/Sound_Of_Math.apk

      - name: Copy APK
        run: |
          cp repo/Sound_Of_Math.apk fdroid/repo/Sound_Of_Math.apk

      - name: Restore F-Droid signing keystore
        env:
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
        run: |
          echo "$FDROID_KEYSTORE" | base64 --decode > fdroid/keystore.p12
          chmod 600 fdroid/keystore.p12

          test -s fdroid/keystore.p12

      - name: Create F-Droid configuration
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          cat > fdroid/config.yml <<EOF
          repo_url: https://cubehub-studio.github.io/sound-of-math-fdroid/repo
          repo_name: Sound of Math F-Droid Repository
          repo_description: Official F-Droid repository for Sound of Math

          archive_older: 0

          keystore: keystore.p12
          keystorepass: ${FDROID_KEYSTORE_PASSWORD}
          keypass: ${FDROID_KEY_PASSWORD}
          repo_keyalias: soundofmath
          EOF

          chmod 600 fdroid/config.yml

      - name: Create app metadata
        run: |
          cat > fdroid/metadata/com.soundofmath.app.yml <<'EOF'
          Categories:
            - Science
            - Education

          License: Unknown

          WebSite: https://cubehub-studio.github.io/sound-of-math-fdroid/

          SourceCode: https://github.com/CubeHub-studio/sound-of-math-fdroid

          IssueTracker: https://github.com/CubeHub-studio/sound-of-math-fdroid/issues

          AutoName: Sound of Math

          Summary: Explore mathematics through sound

          Description: |
            Sound of Math is an application that turns mathematical concepts
            and calculations into sound.
          EOF

      - name: Generate F-Droid repository
        working-directory: fdroid
        run: |
          fdroid update

      - name: Verify F-Droid repository
        run: |
          echo "Repository contents:"
          find fdroid/repo -maxdepth 2 -type f -print

          echo
          echo "Checking required files..."

          test -f fdroid/repo/Sound_Of_Math.apk
          test -f fdroid/repo/index.jar
          test -f fdroid/repo/index.xml

          echo
          echo "F-Droid repository generated successfully!"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload F-Droid repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid/repo

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
